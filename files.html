<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dashboard - Files</title>
		<link rel="shortcut icon" href="images/title.svg" type="image/x-icon" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
			rel="stylesheet"
		/>
		<script
			src="https://kit.fontawesome.com/a0cd21b4c8.js"
			crossorigin="anonymous"
		></script>
		<link rel="stylesheet" href="css/framework.css" />
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<div class="page d-flex">
			<!-- SIDEBAR -->
			<aside class="sidebar bg-white p-20 p-relative">
				<h3 class="p-relative text-center mt-0 hide-mobile">Dashboard</h3>
				<ul>
					<li>
						<a
							href="index.html"
							class="d-flex align-center fs-14 c-black rad-6 p-10"
						>
							<i class="fa-regular fa-chart-bar fa-fw"></i>
							<span class="fs-14 ml-10 hide-mobile">Dashboard</span>
						</a>
					</li>
					<li>
						<a
							href="settings.html"
							class=" d-flex align-center fs-14 c-black rad-6 p-10"
						>
							<i class="fa-solid fa-gear fa-fw"></i>
							<span class="fs-14 ml-10 hide-mobile">Settings</span>
						</a>
					</li>
					<li>
						<a
							href="profile.html"
							class="d-flex align-center fs-14 c-black rad-6 p-10"
						>
							<i class="fa-regular fa-user fa-fw"></i>
							<span class="fs-14 ml-10 hide-mobile">Profile</span>
						</a>
					</li>
					<li>
						<a
							href="projects.html"
							class="d-flex align-center fs-14 c-black rad-6 p-10"
						>
							<i class="fa-solid fa-diagram-project fa-fw"></i>
							<span class="fs-14 ml-10 hide-mobile">Projects</span>
						</a>
					</li>
					<li>
						<a
							href="courses.html"
							class="d-flex align-center fs-14 c-black rad-6 p-10"
						>
							<i class="fa-solid fa-graduation-cap fa-fw"></i>
							<span class="fs-14 ml-10 hide-mobile">Courses</span>
						</a>
					</li>
					<li>
						<a
							href="friends.html"
							class="d-flex align-center fs-14 c-black rad-6 p-10"
						>
							<i class="fa-solid fa-user-group fa-fw"></i>
							<span class="fs-14 ml-10 hide-mobile">Friends</span>
						</a>
					</li>
					<li>
						<a
							href="files.html"
							class="active d-flex align-center fs-14 c-black rad-6 p-10"
						>
							<i class="fa-regular fa-file fa-fw"></i>
							<span class="fs-14 ml-10 hide-mobile">Files</span>
						</a>
					</li>
					<li>
						<a
							href="plans.html"
							class="d-flex align-center fs-14 c-black rad-6 p-10"
						>
							<i class="fa-solid fa-clipboard-list fa-fw"></i>
							<span class="fs-14 ml-10 hide-mobile">Plans</span>
						</a>
					</li>
				</ul>
			</aside>

      <main class="content w-full">
				<!-- || HEADER -->
				<header class="header bg-white p-15 between-flex">
					<section class="header__search p-relative">
						<input
							type="search"
							placeholder="Search..."
							class="b1-grey rad-10 ml-5 p-10"
						/>
					</section>
					<section class="header__icons d-flex align-center">
						<span class="header__notification p-relative">
							<i class="fa-regular fa-bell fa-lg"></i>
						</span>
						<img src="images/avatar.png" alt="Avatar" class="ml-10" />
					</section>
				</header>

				<h1 class="p-relative">Files</h1>
		</div>
	</body>
</html>
